# OntoForge Domain Pack Configuration
# Domain: Optical Access Networks
# Version: 1.0

schema_version: "1.0"

domain:
  id: domain.networking.optical
  name: Optical Access Networks
  taxonomy_tree:
    - topology
    - switching_mechanism
    - performance_metrics
    - modulation_format
    - network_layer

core_metrics:
  - name: reconfiguration_delay
    expected_unit: ms
    aliases:
      - switching_delay
      - matrix_latency
      - reconfiguration_time
    value_type: float

  - name: cross_talk
    expected_unit: dB
    aliases:
      - crosstalk
      - channel_isolation
    value_type: float

  - name: insertion_loss
    expected_unit: dB
    aliases:
      - optical_loss
      - path_loss
    value_type: float

  - name: extinction_ratio
    expected_unit: dB
    aliases:
      - ER
      - on_off_ratio
    value_type: float

  - name: bit_error_rate
    expected_unit: unitless
    aliases:
      - BER
      - error_rate
    value_type: float

  - name: power_consumption
    expected_unit: W
    aliases:
      - energy_consumption
      - power_draw
    value_type: float

  - name: port_count
    expected_unit: ports
    aliases:
      - num_ports
      - switch_size
    value_type: int

  - name: wavelength_range
    expected_unit: nm
    aliases:
      - spectral_range
      - operating_wavelength
    value_type: string

validation:
  required_context_keys:
    - network_load
    - topology
    - temperature

  unit_normalization:
    ms:
      - ms
      - millisecond
      - milliseconds
      - msec
    
    dB:
      - dB
      - db
      - decibel
      - decibels
    
    W:
      - W
      - watt
      - watts
      - w
    
    ports:
      - ports
      - port
    
    nm:
      - nm
      - nanometer
      - nanometers
    
    unitless:
      - unitless
      - ""
      - none
